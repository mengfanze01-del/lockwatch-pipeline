# ========================================
# 入库规则
# ========================================
match_rules:
  primary:
    description: 小米锁机等条线统一口径：品牌词 ×（议题词 OR 锁机安全词）
    expression: "brands.terms AND (topics.terms OR security.terms)"
  dedupe:
    by: [canonical_url, title_hash]
    window_hours: 48
  min_relevance_score: 0.6

# ========================================
# 看板映射（九模块 topic 归属）
# 用于 V14 看板模块的 bucket 归属
# ========================================
board_buckets:
  "01-热点速览": [launch, leak]
  "02-品牌动向": [launch, software, review]
  "03-价格信号": [pricing]
  "04-舆情风向": [review, quality_issue]
  "05-泄密情报": [leak]
  "06-监管认证": [certification]
  "07-锁机安全": [security]
  "08-系统生态": [software]
  "09-风险告警": [quality_issue, security]
